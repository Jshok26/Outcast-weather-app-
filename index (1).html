<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OutcastShell, a simple weather planning application.">
  <title>OutcastShell | Weather Planner</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">Weather planning made simple</p>
      <h1>OutcastShell <span aria-hidden="true">☁</span></h1>
      <p>Check the forecast before heading out.</p>
    </header>
    <section class="panel" aria-labelledby="search-title">
      <h2 id="search-title">Find your forecast</h2>
      <form id="search-form">
        <label for="city">City</label>
        <div class="search-row">
          <input id="city" name="city" type="search" placeholder="e.g. College Park" required autocomplete="address-level2">
          <button type="submit" id="search-button">Get weather</button>
        </div>
      </form>
      <p id="status" class="status" role="status" aria-live="polite">Enter a city to get started.</p>
    </section>
    <section id="results" class="results" hidden aria-labelledby="location-title">
      <div class="panel current">
        <div>
          <p class="eyebrow">Current conditions</p>
          <h2 id="location-title"></h2>
          <p id="condition"></p>
        </div>
        <div class="temperature" id="temperature"></div>
        <p id="details" class="details"></p>
      </div>
      <section class="panel" aria-labelledby="forecast-title">
        <h2 id="forecast-title">Next 5 days</h2>
        <div id="forecast" class="forecast"></div>
      </section>
      <section class="panel" aria-labelledby="tip-title">
        <h2 id="tip-title">Planning tip</h2>
        <p id="tip"></p>
      </section>
    </section>
    <footer>Weather data from <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>. Forecasts are estimates.</footer>
  </main>
</body>
</html>
